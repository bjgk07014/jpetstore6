# PR 검증용 CI 워크플로.
# 단위 테스트(surefire)만 실행하며, 이 워크플로의 job(build)을 브랜치 보호 규칙의
# required status check로 등록해 테스트가 실패한 PR은 머지되지 않도록 한다.
name: CI

on:
  # push 트리거는 두지 않는다. 같은 저장소 브랜치에서 PR을 열면
  # push와 pull_request가 동시에 발동해 같은 커밋이 두 번 검증되기 때문이다.
  pull_request:
    branches:
      - master
      - development
      - 'release/**'
      - 'hotfix/**'
  # Actions 탭의 "Run workflow" 버튼으로 수동 실행
  workflow_dispatch:

# 같은 PR(같은 ref)에 새 커밋이 올라오면 진행 중이던 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 권한을 저장소 읽기로 제한한다(최소 권한 원칙).
permissions:
  contents: read

jobs:
  build:
    # required status check에 이 이름이 그대로 표시되므로 바꾸지 않는다.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 액션은 태그(@v4)로 참조한다. 태그는 나중에 다른 커밋을 가리키도록 옮겨질 수 있으므로,
    # 원본(mybatis/jpetstore-6)처럼 커밋 SHA로 고정하는 편이 공급망 보안상 더 안전하다.
    #   예) uses: actions/checkout@<40자리 커밋 SHA> # v4.x.x
    # SHA 고정은 이후 단계에서 별도로 적용한다.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit test
        id: test
        # -Dlicense.skip=true: 라이선스 헤더가 없는 신규 파일 때문에 license 플러그인이 실패하지 않도록 한다.
        run: ./mvnw --batch-mode --no-transfer-progress test -Dlicense.skip=true

      - name: Upload surefire reports
        # 테스트 단계가 실패했을 때만 리포트를 올린다(실패 원인 분석용).
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
